# PhoneMote, under https://coms.kw.ac.kr/phonemote/ only.
# Included from inside the existing coms.kw.ac.kr server block; it adds these
# two locations and changes nothing else that server serves.

location = /phonemote {
    return 301 /phonemote/;
}

location ^~ /phonemote/ {
    # The trailing slash strips the /phonemote prefix: the container serves at /.
    proxy_pass http://127.0.0.1:4190/;
    proxy_http_version 1.1;
    # Signaling and the relay are WebSockets.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The server pings every 25 s; this only has to outlast that.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
