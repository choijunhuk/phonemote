name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the oldest Node pnpm 11 runs on, so it is the real floor.
        # 24 is what development uses.
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # A fresh checkout has no certs/ directory, so this also proves the
      # apps build without the local dev certificate.
      - run: pnpm build

  e2e:
    name: End-to-end (web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @phonemote/game exec playwright install --with-deps chromium
      - run: pnpm build:web
      # Every game, every mode, thirty seconds each, and phones joining over
      # WebRTC, in a real browser.
      - run: pnpm --filter @phonemote/game test:e2e

      - name: Keep the report and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/game/dist/e2e-report
            apps/game/dist/e2e-screens

      # The files the test just played are the files that get deployed.
      - name: Hand the tested build to Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/game/dist/web

  deploy-demo:
    name: Deploy the web build
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
